<!DOCTYPE html>
<html>
<head>
<title>Cronometro</title>
</head>
<body>

   <p id="cronometro"><span id="minutos">00</span>:<span id="segundos">00</span></p>

   <button id="iniciar">Iniciar</button>
   <button id="pausar">Pausar</button>
   <button id="reiniciar">Reiniciar</button>

<script>
const minutosTexto = document.getElementById("minutos");
const segundosTexto = document.getElementById("segundos");
const btonIniciar = document.getElementById("iniciar");
const btonPausar = document.getElementById("pausar");
const btonReiniciar = document.getElementById("reiniciar");

let minutos = 0;
let segundos = 0;
let intervalo = null;

function formatear(numero) {
  return String(numero).padStart(2, "0");
}

function actualizarPantalla() {
  minutosTexto.textContent = formatear(minutos);
  segundosTexto.textContent = formatear(segundos);
}

btonIniciar.addEventListener("click", () => {
  if (intervalo !== null) return; // ya está en marcha

  intervalo = setInterval(() => {
    segundos++;

    if (segundos === 60) {
      segundos = 0;
      minutos++;
    }

    actualizarPantalla();
  }, 1000);
});

btonPausar.addEventListener("click", () => {
  clearInterval(intervalo);
  intervalo = null;
});

btonReiniciar.addEventListener("click", () => {
  clearInterval(intervalo);
  intervalo = null;
  minutos = 0;
  segundos = 0;
  actualizarPantalla();
});
</script>
</body>
</html>
